<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kailas Wadje</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16211D;
    --paper: #FBFBF9;
    --teal: #2E7D6E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; text-align: center; }
  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 2.8rem);
    margin: 0 0 12px;
  }
  p.claim {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--ink);
    opacity: 0.85;
    margin: 0 0 28px;
  }
  a.cta {
    display: inline-block;
    color: var(--teal);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--teal);
    padding-bottom: 2px;
  }
  a.cta:hover { opacity: 0.75; }
  .note {
    margin-top: 48px;
    font-size: 0.85rem;
    color: var(--ink);
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Kailas Wadje</h1>
    <p class="claim">I build AI systems, then try to break them before anyone else does.</p>
    <a class="cta" href="mailto:wadjekailas96@gmail.com">Email me to talk about roles</a>
    <div class="note">Portfolio under construction — case studies coming soon.</div>
  </div>
</body>
</html>
